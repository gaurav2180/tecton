# Copy to .github/workflows/tecton.yml in your project.
# Pin a release tag (see https://github.com/gaurav2180/tecton/releases).
name: tecton
on: pull_request

permissions:
  contents: read
  pull-requests: write # to comment on the pull request

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tecton compares with the commit your branch split off from

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: gaurav2180/tecton@v0.4.0
        # with:
        #   working-directory: apps/web   # where tecton.config.json lives
        #   strict: 'true'                 # fail on existing rule breaks too
        #   comment: 'false'               # only the job summary + artifact

# Without the action (any CI):
#   npx tecton@0.4 --base "origin/$BASE_BRANCH" --head HEAD --out tecton-report.html --md tecton.md
