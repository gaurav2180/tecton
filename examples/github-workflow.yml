# Copy to .github/workflows/tecton.yml in your project.
# Assumes the tecton folder is committed at tools/tecton (or change the path / use npx once published).
name: tecton
on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tecton needs the base branch history

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compare architecture with the base branch
        id: tecton
        continue-on-error: true
        run: |
          node tools/tecton/bin/tecton.js \
            --base "origin/${{ github.base_ref }}" --head HEAD \
            --out tecton-report.html --md tecton.md

      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body-file tecton.md --edit-last \
            || gh pr comment "${{ github.event.pull_request.number }}" --body-file tecton.md

      - uses: actions/upload-artifact@v4
        with:
          name: tecton-report
          path: tecton-report.html

      - name: Fail if the change breaks an architecture rule
        if: steps.tecton.outcome == 'failure'
        run: exit 1
