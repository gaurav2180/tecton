name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The CLI has no runtime dependencies, so its tests run on a bare checkout, on every supported Node.
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node test/run.js

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Committed client bundle matches the source
        run: npm run check:bundle
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      # Screenshot baselines are recorded per platform. Until Linux ones are committed
      # (npm run test:ui -- --update-snapshots on Linux), CI checks behaviour and script errors only.
      - name: UI tests
        run: |
          if [ -d test/ui/__screenshots__/linux ]; then npx playwright test; else npx playwright test --ignore-snapshots; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
